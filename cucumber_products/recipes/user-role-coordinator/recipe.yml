name: Cucumber products - coordinator 
description: A recipe to manage needed change of configs for the coordinator user role.
type: Testing
config:
  actions:
    user.role.coordinator:
      grantPermissions:
        - 'access products page'
        # The role keeps the products: it adds one, changes any of them and
        # deletes the ones it added itself.
        - 'create product content'
        - 'edit own product content'
        - 'edit any product content'
        - 'delete own product content'
        - 'view product revisions'
