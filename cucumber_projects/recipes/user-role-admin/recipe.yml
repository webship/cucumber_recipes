name: Cucumber projects - admin
description: A recipe to manage needed change of configs for the admin user role.
type: Testing
config:
  actions:
    user.role.admin:
      # These two recipes run from hook_install(), so the role has to be
      # there before anything is granted to it. The Cucumber distribution
      # ships it; on a plain Drupal site it does not exist yet.
      createIfNotExists:
        label: Admin
        is_admin: false
      grantPermissions:
        - 'access projects page'
        # The role keeps the projects: it adds one, changes any of them and
        # deletes the ones it added itself.
        - 'create project content'
        - 'edit own project content'
        - 'edit any project content'
        - 'delete own project content'
        - 'view project revisions'
