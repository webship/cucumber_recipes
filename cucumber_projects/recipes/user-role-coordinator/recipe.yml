name: Cucumber projects - coordinator 
description: A recipe to manage needed change of configs for the coordinator user role.
type: Testing
config:
  actions:
    user.role.coordinator:
      grantPermissions:
        - 'access projects page'
        # The role keeps the projects: it adds one, changes any of them and
        # deletes the ones it added itself.
        - 'create project content'
        - 'edit own project content'
        - 'edit any project content'
        - 'delete own project content'
        - 'view project revisions'
