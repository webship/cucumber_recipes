name: Cucumber components - admin
description: A recipe to manage needed change of configs for the admin user role.
type: Testing
config:
  actions:
    user.role.admin:
      # These two recipes run from hook_install(), so the role has to be
      # there before anything is granted to it. The Cucumber distribution
      # ships it; on a plain Drupal site it does not exist yet.
      createIfNotExists:
        label: Admin
        is_admin: false
      grantPermissions:
        - 'access components page'
