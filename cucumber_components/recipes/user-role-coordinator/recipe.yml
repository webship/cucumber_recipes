name: Cucumber components - coordinator 
description: A recipe to manage needed change of configs for the coordinator user role.
type: Testing
config:
  actions:
    user.role.coordinator:
      grantPermissions:
        - 'access components page'
        # The role keeps the components: it adds one, changes any of them and
        # deletes the ones it added itself.
        - 'create component content'
        - 'edit own component content'
        - 'edit any component content'
        - 'delete own component content'
        - 'view component revisions'
