name: Cucumber components - super admin
description: A recipe to manage needed change of configs for the super admin user role.
type: Testing
config:
  actions:
    user.role.super_admin:
      # These two recipes run from hook_install(), so the role has to be
      # there before anything is granted to it. The Cucumber distribution
      # ships it; on a plain Drupal site it does not exist yet.
      createIfNotExists:
        label: Super Admin
        is_admin: false
      grantPermissions:
        - 'access components page'
